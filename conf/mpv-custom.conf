autofit-larger=100%x100%
border=no
osc=no
osd-bar=no

# High quality rendering
profile=gpu-hq

# Hardware-accelerated video decoding and low-latency audio (macOS).
hwdec=videotoolbox
ao=coreaudio
audio-buffer=0.2
audio-channels=stereo
# coreaudio on this mpv/macOS combo fails to open on planar float input
# ("unable to set the input channel layout on the audio unit ... -50"),
# which is what Opus/AAC decode to, so YouTube played with no sound.
# Interleaved float is a lossless conversion and coreaudio accepts it.
audio-format=float

# Force the RAM cache on for local input too, not just network streams
# (mpv's default cache=auto only enables it for the latter).
cache=yes
demuxer-max-bytes=512M
demuxer-max-back-bytes=128M

# Resume playback from last position
save-position-on-quit=yes

# Keep the player open after playback ends
keep-open=yes

# Don't quit when launched with no files to play - needed so perpetual-playlist
# gets a chance to run and load the saved playlist on a bare `mpv` invocation
idle=yes

# Exclude AV1 (av01.*) video streams. After a network reconnect mid-stream,
# the resumed fragment sometimes gets spliced back together slightly
# misaligned - ffmpeg logs "[ffmpeg] NULL: Invalid OBU length" / "Failed to
# parse temporal unit" (OBU = AV1's bitstream unit format) right at that
# seam. VP9/H.264 streams just show a brief decode glitch in the same
# situation instead of a parser error, so excluding AV1 avoids it. `!*=`
# matches "does not contain" rather than exact-equals, since YouTube's
# vcodec strings for AV1 include a profile/level suffix (e.g.
# "av01.0.05M.08"), not the bare "av01" an exact != would need.
ytdl-format=bestvideo[vcodec!*=?av01]+bestaudio/best

# Save screenshots to the Desktop
screenshot-directory=~/Desktop

# Unix socket for external IPC control (see plugins/mpv-remote/bin/mpv-remote).
# ~~cache/ is mpv's own
# cross-platform application-cache dir (~/.cache/mpv/ on Linux,
# ~/Library/Caches/io.mpv/ on macOS - confirmed empirically, not just
# from docs) - kept outside the git-tracked config tree, and mpv creates
# it itself at startup before binding, so no directory needs to exist
# beforehand. (~~state/ was tried first as a better semantic fit, but
# proved unreliable on this mpv build - it resolved back into the
# git-tracked config dir, or failed to bind outright, depending on
# context; ~~cache/ is the one that actually works.)
input-ipc-server=~~cache/mpv.sock

# Silence libass's "failed to find any fallback" fontselect warnings - these
# fire on subtitles/OSD text containing color emoji, which libass can never
# render (no color-glyph support), so the warning is just noise. =error
# turned out not to be strict enough to hide it (still seen in practice);
# =fatal is the strictest level mpv's msg-level accepts. Covers both
# libass instances - osd/libass (OSD text, e.g. a video title containing
# an emoji) and sub/ass (actual subtitle files) - since both can hit this.
msg-level=osd/libass=fatal,sub/ass=fatal

# ModernZ (script-opts/modernz.conf's sub_margins=yes) temporarily nudges
# sub-pos up while its bottom bar is visible, then restores it on hide -
# exclude sub-pos from watch-later so a resume can never restore mid-nudge
# state instead of the real, unshifted position.
#
# vid is also excluded: podcast-mode (scripts/podcast_mode.lua) is
# deliberately session-only, but without this it would still get
# persisted as a side effect of mpv's own watch-later mechanism, so
# reopening a file toggled to audio-only would silently resume "no
# video" on a file the user never asked for that on.
watch-later-options-del=sub-pos,vid

# Keep resume-position files outside the git-tracked config tree, same as
# last_playlist.json and mpv.sock. Plain ~/ path, not a ~~ meta-path -
# ~~state/ was tried for the IPC socket and proved unreliable on this mpv
# build; mpv creates this directory itself (confirmed, including missing
# nested levels), so no self-heal code is needed here either.
watch-later-directory=~/.local/state/mpv/watch_later
